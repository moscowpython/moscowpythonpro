[project]
name = "moscowpythonpro"
version = "0.1.0"
description = "Moscow Python Pro — камерные мероприятия для опытных разработчиков"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<5.3",
    "dj-database-url>=2.3,<4",
    "gunicorn>=23,<24",
    "psycopg[binary]>=3.2,<4",
    "whitenoise>=6.9,<7",
    "python-dotenv>=1.1,<2",
    "pillow>=11",
]

[dependency-groups]
dev = ["ruff>=0.11"]

[tool.ruff]
line-length = 100
exclude = ["**/migrations/**"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
