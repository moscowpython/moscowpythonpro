x-app: &app
  build: .
  environment:
    SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in the environment or local .env}
    DEBUG: ${DEBUG:-False}
    ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,[::1]}
    CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
    SITE_URL: ${SITE_URL:-}
    SITE_URL_FROM_REQUEST: ${SITE_URL_FROM_REQUEST:-False}
    TRUST_PROXY_SSL_HEADER: ${TRUST_PROXY_SSL_HEADER:-False}
    DATABASE_URL: postgresql://${POSTGRES_USER:-moscowpythonpro}:${POSTGRES_PASSWORD:-local-development-only}@db:5432/${POSTGRES_DB:-moscowpythonpro}
    DEFAULT_ADMIN_LOGIN: ${DEFAULT_ADMIN_LOGIN:-}
    DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-}

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-moscowpythonpro}
      POSTGRES_USER: ${POSTGRES_USER:-moscowpythonpro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
  migrate:
    <<: *app
    command: ["sh", "-c", "python manage.py migrate --noinput && python manage.py setup_default_admin"]
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
  web:
    <<: *app
    volumes:
      - resident_photos:/app/media
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
volumes:
  postgres_data:
  resident_photos:
