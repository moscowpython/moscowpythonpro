<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>MoscowPython Pro — обложка 1920×1080 (light)</title>
<!-- Обложка на базе mp-pro-logo-light: белый фон, локап 1б по центру, масштаб ~64% -->
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; }
  body {
    background: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Myriad Pro', 'Segoe UI', 'Trebuchet MS', Verdana, sans-serif;
  }
  .scale { transform: scale(.64); }
  .wordmark {
    display: flex;
    align-items: baseline;
    font-size: 270px;
    line-height: 1;
    color: #616161;
    font-weight: 400;
    white-space: nowrap;
  }
  .star {
    width: 98px;
    height: 98px;
    margin: 0 24px 0 20px;
    align-self: baseline;
    position: relative;
    top: 16px;
  }
  .star polygon { fill: #F32621; }
  .col {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
  }
  .pro {
    font-size: 148px;
    color: #F32621;
    letter-spacing: .03em;
    margin-top: 24px;
  }
</style>
</head>
<body>
  <div class="scale">
    <div class="wordmark">
      <span>Moscow</span>
      <svg class="star" viewBox="-52 -52 104 104"><polygon points="0,-50 11.76,-16.18 47.55,-15.45 19.02,6.18 29.39,40.45 0,20 -29.39,40.45 -19.02,6.18 -47.55,-15.45 -11.76,-16.18"/></svg>
      <div class="col">
        <span>Python</span>
        <span class="pro">pro</span>
      </div>
    </div>
  </div>
</body>
</html>
