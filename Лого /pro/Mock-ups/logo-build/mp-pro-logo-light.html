<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>MoscowPython Pro — light (для светлого фона)</title>
<!--
  MoscowPython Pro · локап 1б: «pro» под «Python», по правому краю
  Параметры сняты с оригинала mp-logo-01.png (капс 192px @1920):
    серый #616161 · красный #F32621 · звезда 0.44×капс (84px)
    зазоры: Moscow→звезда 32px, звезда→Python 51px
    низ звезды на 14px ниже базовой линии
    «pro»: 55% кегля, красный, под Python по правому краю
  Шрифт подстановочный — в Illustrator применить фирменный и перевести в кривые.
-->
<style>
  @page { size: 2004px 540px; margin: 0; }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 2004px; height: 540px; }
  body {
    background: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Myriad Pro', 'Segoe UI', 'Trebuchet MS', Verdana, sans-serif;
  }
  .wordmark {
    display: flex;
    align-items: baseline;
    font-size: 270px;   /* капс ≈ 190px */
    line-height: 1;
    color: #616161;
    font-weight: 400;
    white-space: nowrap;
  }
  .star {
    width: 98px;
    height: 98px;
    margin: 0 24px 0 20px;
    align-self: baseline;
    position: relative;
    top: 16px; /* низ звезды на 14px ниже базовой линии (по ink), как в оригинале */
  }
  .star polygon { fill: #F32621; }
  .col {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
  }
  .pro {
    font-size: 148px;   /* 55% кегля */
    color: #F32621;
    letter-spacing: .03em;
    margin-top: 24px;
  }
</style>
</head>
<body>
  <div class="wordmark">
    <span>Moscow</span>
    <svg class="star" viewBox="-52 -52 104 104"><polygon points="0,-50 11.76,-16.18 47.55,-15.45 19.02,6.18 29.39,40.45 0,20 -29.39,40.45 -19.02,6.18 -47.55,-15.45 -11.76,-16.18"/></svg>
    <div class="col">
      <span>Python</span>
      <span class="pro">pro</span>
    </div>
  </div>
</body>
</html>
