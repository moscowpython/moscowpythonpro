<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>MoscowPython — pro под Python</title>
<style>
  :root {
    --red: #ed1c24;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: 'Myriad Pro', 'Segoe UI', 'Trebuchet MS', Verdana, sans-serif;
    background: #e9e9e9;
    padding: 48px;
  }
  h1 { font-size: 22px; color: #333; margin-bottom: 8px; }
  .note { font-size: 14px; color: #777; margin-bottom: 32px; }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 28px;
    max-width: 1500px;
  }
  .cell { border-radius: 10px; overflow: hidden; box-shadow: 0 1px 6px rgba(0,0,0,.18); }
  .tile {
    height: 340px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .tile.dark  { background: #0a0a0a; }
  .tile.light { background: #ffffff; }
  .cap {
    font-size: 13px;
    padding: 10px 16px;
    background: #222;
    color: #ccc;
    font-family: -apple-system, 'Segoe UI', sans-serif;
  }

  /* ---- знак ---- */
  .wordmark {
    display: flex;
    align-items: baseline;
    font-size: 76px;
    line-height: 1;
    color: #5b5b5b;
    font-weight: 400;
    white-space: nowrap;
  }
  .tile.light .wordmark { color: #4c4c4c; }

  .star {
    width: .38em;
    height: .38em;
    margin: 0 .17em;
    align-self: baseline;
    transform: translateY(-.015em);
  }
  .star polygon { fill: var(--red); }

  /* колонка: Python, под ним pro по правому краю */
  .col {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
  }
  .pro {
    font-size: .55em;
    color: var(--red);
    letter-spacing: .03em;
    margin-top: .14em; /* в em от .pro: зазор до Python */
  }
</style>
</head>
<body>

<h1>Moscow★Python · «pro» под «Python», по правому краю</h1>
<div class="note">Мокап: шрифт подстановочный, финальный собрать в mp-logo.ai.</div>

<div class="grid">

  <div class="cell">
    <div class="tile dark">
      <div class="wordmark">
        <span>Moscow</span>
        <svg class="star" viewBox="-52 -52 104 104"><polygon points="0,-50 11.76,-16.18 47.55,-15.45 19.02,6.18 29.39,40.45 0,20 -29.39,40.45 -19.02,6.18 -47.55,-15.45 -11.76,-16.18"/></svg>
        <div class="col">
          <span>Python</span>
          <span class="pro">pro</span>
        </div>
      </div>
    </div>
    <div class="cap">Вариант 1б · «pro» под «Python» · тёмный фон</div>
  </div>

  <div class="cell">
    <div class="tile light">
      <div class="wordmark">
        <span>Moscow</span>
        <svg class="star" viewBox="-52 -52 104 104"><polygon points="0,-50 11.76,-16.18 47.55,-15.45 19.02,6.18 29.39,40.45 0,20 -29.39,40.45 -19.02,6.18 -47.55,-15.45 -11.76,-16.18"/></svg>
        <div class="col">
          <span>Python</span>
          <span class="pro">pro</span>
        </div>
      </div>
    </div>
    <div class="cap">Вариант 1б · «pro» под «Python» · светлый фон</div>
  </div>

</div>

</body>
</html>
